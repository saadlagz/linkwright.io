<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Linkwright">
  <!-- Two forged links, interlocked: the issue on one side, the code on the other.
       Deliberately no Git diamond, no Octocat, no Atlassian blue (brand rules). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16302A"/>
      <stop offset="1" stop-color="#0B1916"/>
    </linearGradient>
    <!-- Cuts the brass link where the teal one passes over it (upper crossing only). -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="144" height="144">
      <rect width="144" height="144" fill="#fff"/>
      <g clip-path="url(#near)">
        <rect x="54" y="62" width="76" height="36" rx="18" fill="none" stroke="#000" stroke-width="19"/>
      </g>
    </mask>
    <clipPath id="near"><circle cx="90" cy="62" r="13"/></clipPath>
  </defs>
  <rect width="144" height="144" rx="32" fill="url(#bg)"/>
  <g transform="rotate(-24 72 72)" fill="none" stroke-width="12">
    <rect x="54" y="62" width="76" height="36" rx="18" stroke="#3FD0A4"/>
    <rect x="14" y="44" width="76" height="36" rx="18" stroke="#F2B544" mask="url(#gap)"/>
  </g>
</svg>
